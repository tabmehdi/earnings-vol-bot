# Strategy parameters. Changing a strategy fact needs an ADR in docs/decisions/.

[filters]
min_avg_volume_30d = 1_500_000
min_iv30_rv30 = 1.25
max_term_slope = -0.00406      # per day, front expiry to 45d
term_slope_horizon_days = 45
max_leg_spread_pct = 0.10      # leg spread as a fraction of mid
min_open_interest = 500

[structure]
back_expiry_offset_days = 30   # back = expiry closest to front + 30 days

[schedule]
entry_minutes_before_close = 15
exit_minutes_after_open = 15

[pricing]
risk_free_rate = 0.045

[metrics]
iv_days = 30
rv_window = 30
volume_window = 30
trading_days_per_year = 252

[market_data]
data_base_url = "https://data.alpaca.markets"
trading_base_url = "https://paper-api.alpaca.markets"
earnings_url = "https://api.nasdaq.com/api/calendar/earnings"
options_feed = "indicative"    # quotes only; indicative trades are delayed 15 minutes
spot_feed = "iex"
history_feed = "sip"           # allowed on the free plan for completed sessions
chain_max_days = 75
strike_range_pct = 0.25        # requested strikes: spot +/- 25%
max_quote_age_seconds = 300
max_retries = 4
backoff_seconds = 1.0
timeout_seconds = 20.0
alpaca_requests_per_minute = 180   # the free plan allows 200
nasdaq_requests_per_minute = 30

[storage]
snapshot_dir = "data/snapshots"
