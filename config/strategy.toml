# Strategy parameters. Changing a strategy fact needs an ADR in docs/decisions/.

[filters]
min_avg_volume_30d = 1_500_000
min_iv30_rv30 = 1.25
max_term_slope = -0.00406      # per day, front expiry to 45d
term_slope_horizon_days = 45

[structure]
back_target_days = 30   # back = standard monthly closest to front + 30 days (ADR 0006)
back_min_gap_days = 21  # ...and at least this many days after the front

[schedule]
entry_minutes_before_close = 15
exit_minutes_after_open = 15
scan_start = "15:25"            # New York time; the scan-only timer (Phase 4)
session_start = "09:00"         # New York time; the trading session starts here (Phase 5)
scan_minutes_before_close = 35
entry_cutoff_minutes_before_close = 5   # no new order after this
recheck_count = 2               # fresh looks at the candidates before entering
recheck_gap_seconds = 60
exit_retry_minutes = 15
exit_deadline_time = "15:00"    # New York, on the front leg's expiry day
exit_deadline_minutes_before_close = 60   # earlier on an early-close day

[pricing]
risk_free_rate = 0.045          # fallback when FRED is unavailable or FRED_API_KEY is unset

[metrics]
iv_days = 30
rv_window = 30
volume_window = 30
trading_days_per_year = 252
max_iv_input_spread_pct = 0.50  # a wider quote has no meaningful mid to solve an IV from

[market_data]
data_base_url = "https://data.alpaca.markets"
trading_base_url = "https://paper-api.alpaca.markets"
earnings_url = "https://api.nasdaq.com/api/calendar/earnings"
options_feed = "indicative"    # quotes only; indicative trades are delayed 15 minutes
spot_feed = "iex"
history_feed = "sip"           # allowed on the free plan for completed sessions
chain_max_days = 75
strike_range_pct = 0.25        # requested strikes: spot +/- 25%
max_quote_age_seconds = 300
max_retries = 4
backoff_seconds = 1.0
timeout_seconds = 20.0
alpaca_requests_per_minute = 180   # the free plan allows 200
nasdaq_requests_per_minute = 30
fred_url = "https://api.stlouisfed.org/fred/series/observations"
fred_series = "DGS3MO"           # 3-month Treasury constant maturity, in percent
fred_requests_per_minute = 30    # FRED allows 120; a scan makes one request

[execution]
max_risk_per_trade_pct = 0.02  # a calendar can lose its debit: that is the risk
max_contracts = 10
max_spread_cost_pct = 0.35     # provisional; calibrate from the recorded scans (ADR)
max_open_positions = 5
max_committed_pct = 0.20
walk_steps = 5
walk_step_seconds = 20
entry_cap_fraction = 0.5       # entries never pay more than mid + 50% of half-width

[storage]
snapshot_dir = "data/snapshots"
signals_dir = "data/signals"
logs_dir = "data/logs"
locks_dir = "data/locks"
trades_dir = "data/trades"
